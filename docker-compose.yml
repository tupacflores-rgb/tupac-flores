# Sistema de Rolando Flores · Academia Novit 2026 · TP Planta de inyección
#
# Requiere la planta levantada (crea la red externa planta-lan):
#   docker compose -p planta -f <repo de la planta>/docker-compose.yml up -d --build
# Después:
#   docker compose up -d --build
#
# Todos los servicios de la PC de planta:
#   - van solo en planta-lan (red external) y llevan el label academia.planta: pc;
#   - suman entre todos un límite de 4 CPU y 8 GB;
#   - salen a internet por HTTP(S)_PROXY=http://enlace:3128.
#
# Sin política `restart`: el simulador apaga (kill) y enciende (start) los contenedores con el label pc para
# simular el corte de luz, y una política de reinicio de Docker lo desvirtuaría.

x-planta: &planta
  networks: [planta-lan]
  labels:
    academia.planta: pc

x-proxy: &proxy
  HTTP_PROXY: http://enlace:3128
  HTTPS_PROXY: http://enlace:3128
  http_proxy: http://enlace:3128
  https_proxy: http://enlace:3128
  NO_PROXY: broker,sim,db,asr,emb,llm,localhost,127.0.0.1
  no_proxy: broker,sim,db,asr,emb,llm,localhost,127.0.0.1

services:
  agente:
    <<: *planta
    build:
      context: .
      dockerfile: docker/agente.Dockerfile
    environment:
      <<: *proxy
      SISTEMA_NOMBRE: ${SISTEMA_NOMBRE:-Rolando Flores}
      MQTT_HOST: broker
      # Nombre del proyecto de compose: define el client_id MQTT (<proyecto>-agente) y evita pisar sesiones.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-tupac-flores}
      PLANTA_URL: http://sim:8100
      DATABASE_URL: postgresql://sistema:${POSTGRES_PASSWORD:-sistema}@db:5432/sistema
      ASR_URL: http://asr:8000
      EMB_URL: http://emb:8000
      LLM_URL: http://llm:11434
      LLM_MODELO: ${LLM_MODELO:-qwen3.5:2b}
      CONFIRMACION_ESTRICTA: ${CONFIRMACION_ESTRICTA:-true}
    volumes:
      - agente-journal:/var/lib/sistema/journal
    depends_on:
      db:
        condition: service_healthy
      asr:
        condition: service_healthy
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 1g}

  # Transcripción local en su propio contenedor, con cuota propia: no le quita CPU al agente ni al latido
  # y protege los 30 s de la alerta de seguridad. El modelo viene dentro de la imagen (sin descargas en runtime).
  asr:
    <<: *planta
    build:
      context: .
      dockerfile: docker/asr.Dockerfile
    environment:
      <<: *proxy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u,sys; sys.exit(0 if u.build_opener(u.ProxyHandler({})).open('http://localhost:8000/salud', timeout=3).status == 200 else 1)"
      interval: 3s
      timeout: 4s
      retries: 60
      start_period: 20s
    deploy:
      resources:
        # 2 carriles (seguridad y completa) de 1 hilo cada uno corriendo a la vez con el mismo modelo.
        limits: {cpus: "2.0", memory: 2g}

  # Embeddings (multilingual-e5-small, ONNX) y búsqueda densa en pgvector. Los pasajes se calculan en el build.
  emb:
    <<: *planta
    build:
      context: .
      dockerfile: docker/emb.Dockerfile
    environment:
      <<: *proxy
      DATABASE_URL: postgresql://sistema:${POSTGRES_PASSWORD:-sistema}@db:5432/sistema
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u,sys; sys.exit(0 if u.build_opener(u.ProxyHandler({})).open('http://localhost:8000/salud', timeout=3).status == 200 else 1)"
      interval: 3s
      timeout: 4s
      retries: 60
      start_period: 15s
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 1g}

  # Respaldo con modelo de lenguaje local (Ollama): solo si el parser no entiende una nota o una respuesta.
  # Los pesos y sus digests viven dentro de la imagen; al arrancar se verifican. Sin puertos publicados.
  llm:
    <<: *planta
    build:
      context: .
      dockerfile: docker/llm.Dockerfile
      args:
        MODELOS: "${LLM_MODELO:-qwen3.5:2b}"
    environment:
      <<: *proxy
      MODELO: ${LLM_MODELO:-qwen3.5:2b}
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    deploy:
      resources:
        limits: {cpus: "0.75", memory: 2560m}

  db:
    <<: *planta
    build:
      context: docker/db
    environment:
      POSTGRES_USER: sistema
      POSTGRES_DB: sistema
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sistema}
    volumes:
      - db-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sistema -d sistema"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 1g}

networks:
  planta-lan:
    external: true

volumes:
  db-datos:
  agente-journal:
